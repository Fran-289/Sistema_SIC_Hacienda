quarkus.http.port=8081

# Base de datos MariaDB (XAMPP)
quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/sic_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador

# Flyway - migra automáticamente al iniciar
quarkus.flyway.active=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ORM / Hibernate (dialect autodetectado para MariaDB)
quarkus.hibernate-orm.log.sql=false

# Límites HTTP contra ataques DoS / Payloads excesivos
quarkus.http.limits.max-body-size=1M
quarkus.http.limits.max-header-size=20K

# Seguridad JWT
mp.jwt.verify.issuer=https://sic.hacienda.gob.sv
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=30
smallrye.jwt.sign.key.location=privateKey.pem

# Mailer
quarkus.mailer.host=localhost
quarkus.mailer.port=25
quarkus.mailer.mock=true

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3001,http://localhost:3000
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS
quarkus.http.cors.access-control-allow-credentials=true
